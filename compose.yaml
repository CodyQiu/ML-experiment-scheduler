# Local stack: PostgreSQL, the scheduler API, and training workers.
# Credentials are for local development only. More workers: docker compose up --scale worker=3
name: ml-scheduler

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker,
      # so the volume mounts the parent directory (not the pre-18 .../data path).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -h forces TCP: during first-time init the server listens only on a Unix socket,
      # and a socket-based check would report "ready" before the real server starts.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "scheduler", "-d", "scheduler"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scheduler
      SPRING_DATASOURCE_USERNAME: scheduler
      SPRING_DATASOURCE_PASSWORD: scheduler
      # One JSON object per line, in Spring Boot's Elastic Common Schema format (see docs/DESIGN.md).
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  worker:
    build: ./worker
    environment:
      SCHEDULER_API_URL: http://api:8080
      # The same JSON shape as the API's, so one query follows a job through both.
      LOG_FORMAT: json
    depends_on:
      api:
        condition: service_healthy
    # One CPU per worker, matching its single PyTorch thread (see worker/Dockerfile), so adding
    # workers adds parallelism instead of oversubscribing cores.
    cpus: 1.0
    # SIGTERM lets a busy worker finish and report its current job; SIGKILL follows after this.
    stop_grace_period: 60s

volumes:
  postgres-data:
